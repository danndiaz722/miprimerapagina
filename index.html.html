<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Now</title>
    <!-- Tailwind CSS para agilizar maquetación y estilos base -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .card-bg {
            background-color: #131b2e;
            border: 1px solid #1e293b;
        }
        .main-gradient {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 50%, #4338ca 100%);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <div class="w-full max-w-6xl">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-sun text-amber-400 text-2xl"></i>
                <span class="text-xl font-bold tracking-wide">Weather Now</span>
            </div>
            <div class="flex items-center gap-2 card-bg px-3 py-1.5 rounded-lg text-sm cursor-pointer">
                <i class="fa-solid fa-gear text-xs"></i>
                <span id="unit-label">Units (°C)</span>
            </div>
        </header>

        <!-- Título Principal -->
        <h1 class="text-3xl md:text-4xl font-bold text-center mb-6">How's the sky looking today?</h1>

        <!-- Buscador -->
        <div class="flex justify-center mb-8 gap-2">
            <div class="relative w-full max-w-md">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-400"></i>
                <input type="text" id="search-input" placeholder="Search for a place..." 
                    class="w-full card-bg text-white pl-11 pr-4 py-3 rounded-xl focus:outline-none focus:border-blue-500 placeholder-gray-500">
            </div>
            <button id="search-btn" class="bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-xl font-semibold transition-colors cursor-pointer">
                Search
            </button>
        </div>

        <!-- Layout Principal -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Columna Izquierda / Central (Datos Principales + Pronóstico Diario) -->
            <div class="lg:col-span-2 flex flex-col gap-6">
                <!-- Tarjeta Principal del Clima -->
                <div class="main-gradient rounded-3xl p-6 md:p-8 relative overflow-hidden shadow-xl flex justify-between items-center">
                    <div>
                        <h2 id="location-name" class="text-2xl md:text-3xl font-bold mb-1">Aguascalientes, MX</h2>
                        <p id="current-date" class="text-blue-100 text-sm">Thursday, Aug 5, 2025</p>
                    </div>
                    <div class="text-right flex items-center gap-4">
                        <i id="main-weather-icon" class="fa-solid fa-sun text-amber-300 text-5xl md:text-6xl"></i>
                        <div>
                            <span id="current-temp" class="text-5xl md:text-6xl font-bold">20°</span>
                        </div>
                    </div>
                </div>

                <!-- Tarjetas Secundarias (Feels like, Humidity, Wind, Precip) -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="card-bg p-4 rounded-2xl">
                        <p class="text-gray-400 text-xs mb-1">Feels Like</p>
                        <p id="feels-like" class="text-xl font-bold">18°</p>
                    </div>
                    <div class="card-bg p-4 rounded-2xl">
                        <p class="text-gray-400 text-xs mb-1">Humidity</p>
                        <p id="humidity" class="text-xl font-bold">46%</p>
                    </div>
                    <div class="card-bg p-4 rounded-2xl">
                        <p class="text-gray-400 text-xs mb-1">Wind</p>
                        <p id="wind-speed" class="text-xl font-bold">14 km/h</p>
                    </div>
                    <div class="card-bg p-4 rounded-2xl">
                        <p class="text-gray-400 text-xs mb-1">Precipitation</p>
                        <p id="precipitation" class="text-xl font-bold">0 mm</p>
                    </div>
                </div>

                <!-- Pronóstico Diario (Daily Forecast) -->
                <div>
                    <h3 class="text-lg font-semibold mb-4">Daily forecast</h3>
                    <div id="daily-container" class="grid grid-cols-3 sm:grid-cols-7 gap-3">
                        <!-- Se llena mediante JS -->
                    </div>
                </div>
            </div>

            <!-- Columna Derecha (Hourly Forecast) -->
            <div class="card-bg rounded-3xl p-6 flex flex-col h-full">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-semibold">Hourly forecast</h3>
                    <span id="current-day-label" class="text-xs bg-gray-800 text-gray-300 px-2 py-1 rounded-md">Today</span>
                </div>
                <div id="hourly-container" class="flex flex-col gap-4 overflow-y-auto max-h-[480px] pr-1">
                    <!-- Se llena mediante JS -->
                </div>
            </div>

        </div>
    </div>

    <script>
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');

        // Función para traducir códigos de clima de Open-Meteo a iconos de FontAwesome
        fnGetWeatherIcon = (code) => {
            if (code === 0) return { icon: 'fa-sun text-amber-400', name: 'Sunny' };
            if ([1, 2, 3].includes(code)) return { icon: 'fa-cloud-sun text-gray-300', name: 'Partly Cloudy' };
            if ([45, 48].includes(code)) return { icon: 'fa-smog text-gray-400', name: 'Foggy' };
            if ([51, 53, 55, 56, 57, 61, 63, 65].includes(code)) return { icon: 'fa-cloud-rain text-blue-400', name: 'Rainy' };
            if ([71, 73, 75, 77].includes(code)) return { icon: 'fa-snowflake text-blue-200', name: 'Snowy' };
            if ([95, 96, 99].includes(code)) return { icon: 'fa-cloud-bolt text-amber-500', name: 'Storm' };
            return { icon: 'fa-cloud text-gray-400', name: 'Cloudy' };
        };

        async function getWeatherData(latitude, longitude, locationName) {
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`;
                
                const response = await fetch(url);
                const data = await response.json();

                // Actualizar datos principales
                document.getElementById('location-name').innerText = locationName;
                
                const now = new Date();
                const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
                document.getElementById('current-date').innerText = now.toLocaleDateString('en-US', options);

                const currentWeather = data.current;
                document.getElementById('current-temp').innerText = Math.round(currentWeather.temperature_2m) + '°';
                document.getElementById('feels-like').innerText = Math.round(currentWeather.apparent_temperature) + '°';
                document.getElementById('humidity').innerText = currentWeather.relative_humidity_2m + '%';
                document.getElementById('wind-speed').innerText = Math.round(currentWeather.wind_speed_10m) + ' km/h';
                document.getElementById('precipitation').innerText = currentWeather.precipitation + ' mm';

                const mainInfo = fnGetWeatherIcon(currentWeather.weather_code);
                document.getElementById('main-weather-icon').className = `fa-solid ${mainInfo.icon} text-5xl md:text-6xl`;

                // Renderizar Pronóstico por Horas (Siguientes 6 horas a partir de la actual)
                const hourlyContainer = document.getElementById('hourly-container');
                hourlyContainer.innerHTML = '';
                const currentHourIndex = new Date().getHours();
                
                for (let i = currentHourIndex; i < currentHourIndex + 7; i++) {
                    if (data.hourly.time[i]) {
                        const timeString = new Date(data.hourly.time[i]).toLocaleTimeString('en-US', { hour: 'numeric', hour12: true });
                        const temp = Math.round(data.hourly.temperature_2m[i]);
                        const code = data.hourly.weather_code[i];
                        const iconClass = fnGetWeatherIcon(code).icon;

                        hourlyContainer.innerHTML += `
                            <div class="flex justify-between items-center py-2 border-b border-gray-800/60 last:border-none">
                                <div class="flex items-center gap-3">
                                    <i class="fa-solid ${iconClass} w-6"></i>
                                    <span class="text-sm text-gray-300">${timeString}</span>
                                </div>
                                <span class="font-semibold">${temp}°</span>
                            </div>
                        `;
                    }
                }

                // Renderizar Pronóstico Diario (7 días)
                const dailyContainer = document.getElementById('daily-container');
                dailyContainer.innerHTML = '';
                for (let i = 0; i < 7; i++) {
                    const dateObj = new Date(data.daily.time[i]);
                    const dayName = dateObj.toLocaleDateString('en-US', { weekday: 'short' });
                    const maxTemp = Math.round(data.daily.temperature_2m_max[i]);
                    const minTemp = Math.round(data.daily.temperature_2m_min[i]);
                    const code = data.daily.weather_code[i];
                    const iconClass = fnGetWeatherIcon(code).icon;

                    dailyContainer.innerHTML += `
                        <div class="card-bg p-3 rounded-2xl flex flex-col items-center justify-between text-center">
                            <span class="text-xs text-gray-400">${dayName}</span>
                            <i class="fa-solid ${iconClass} text-xl my-2"></i>
                            <div class="text-xs font-semibold flex flex-col gap-1">
                                <span>${maxTemp}°</span>
                                <span class="text-gray-500">${minTemp}°</span>
                            </div>
                        </div>
                    `;
                }

            } catch (error) {
                console.error('Error al obtener el clima:', error);
                alert('No se pudo obtener la información del clima.');
            }
        }

        // Función para buscar coordenadas de una ciudad usando la API gratuita de geocodificación de Open-Meteo
        async function searchLocation(query) {
            if (!query) return;
            try {
                const response = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en&format=json`);
                const data = await response.json();

                if (data.results && data.results.length > 0) {
                    const loc = data.results[0];
                    const fullName = `${loc.name}, ${loc.country || ''}`;
                    getWeatherData(loc.latitude, loc.longitude, fullName);
                } else {
                    alert('Location not found');
                }
            } catch (error) {
                console.error('Error buscando la ubicación:', error);
            }
        }

        // Eventos de búsqueda
        searchBtn.addEventListener('click', () => searchLocation(searchInput.value));
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchLocation(searchInput.value);
        });

        // Cargar por defecto tu ubicación actual (Aguascalientes) al abrir la página
        searchLocation('Aguascalientes');
    </script>
</body>
</html>
